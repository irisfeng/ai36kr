      <h1>黄仁勋组了个联盟，AI圈几乎全员到齐，只有这一家唱反调</h1>
      
      <p class="summary">黄仁勋组建“开放安全AI联盟”，英伟达携37家成员推动透明化AI安全体系，旨在抵御闭源模型风险并巩固自身算力生态。此举表面上倡导开放与安全，实则为应对芯片自研潮与政策挤压的商业博弈。OpenAI、谷歌补签加入，唯有Anthropic因商业模式冲突而孤立反对，路线之争背后皆是商业利益。</p>
