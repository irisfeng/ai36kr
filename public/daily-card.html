      <h1>长安汽车：力争在2028年实现人形机器人量产</h1>
      
      <p class="summary">长安汽车近日在路演活动中表示，公司将加速推动具身智能人形机器人、飞行汽车等新兴产业布局和产业化落地，力争在2028年实现人形机器人量产、2030年推出商用航线飞行汽车，各项研发均按计划有序推进，具体进展以公司官方发布为准。（证券时报）</p>
