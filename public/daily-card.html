      <h1>马斯克：SpaceX为GPU采购敲定400亿美元债务融资</h1>
      
      <p class="summary">马斯克公开表示，SpaceX凭借投资级信用评级和稳定营收，敲定400亿美元债务融资，资金将用于采购明年上半年到货的GPU，他认为大量无独立营收的新型云厂商将迎来批量整合。</p>
