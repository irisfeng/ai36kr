      <h1>中信建投：9月均衡配置，重视机构低配品种</h1>
      
      <p class="summary">36氪获悉，中信建投研报称，展望9月，市场仍处存量博弈、结构性行情占优的环境，配置上：建议一方面保留AI算力、有色、创新药及部分出海制造等景气持续验证方向；另一方面重视机构低配品种，关注银行、保险、证券等兼具高股息防御属性方向，电池、工业金属、能源金属、基础化工等兼具盈利改善的方向和钢铁、生猪养殖等周期拐点渐进的方向。</p>
