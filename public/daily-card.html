      <h1>估值610亿元之后，宇树要卖多少台机器人？</h1>
      
      <p class="summary">如果宇树未来仍然主要依靠销售硬件，610亿元大概要每年卖出10万台以上。但如果宇树能把机器人变成“持续服务入口”，那可能就是另一个答案。</p>
