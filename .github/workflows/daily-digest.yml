name: daily-digest

# 每日 08:00（北京时间）向已确认订阅者发送「今日 AI 一页」邮件
on:
  schedule:
    - cron: '13 0 * * *'  # 00:13 UTC = 08:13 北京时间（避开整点高峰排队）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 发送日报邮件
        run: node scripts/send-daily.mjs
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: 生成今日头条海报
        run: node scripts/daily-card.mjs
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: 提交海报
        run: |
          git config user.name "tidewire-bot"
          git config user.email "tidewire-bot@users.noreply.github.com"
          git add public/daily-card.html
          if git diff --cached --quiet; then
            echo "海报无变化"
          else
            git commit -m "chore(card): 今日头条海报 $(date -u +'%Y-%m-%d')"
            git push
          fi
