name: aggregate

# 定时聚合全部 RSS 源：直写 Turso（站点实时数据源），内容快照提交到独立
# snapshot 分支作为备份（Vercel 只监听 main，从此快照提交不再触发部署，
# 每天节省 ~48 次构建）。main 分支的数据快照由 daily-digest 每日更新一次，
# 供冷启动水合/灾难恢复用。
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# 与 daily-digest 共用同一并发组：两个 workflow 都会 push main，串行化避免
# GitHub 延迟释放的定时运行成批撞车（non-fast-forward）
concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 聚合全部信息源并导出快照
        run: node scripts/aggregate.mjs && cp data/snapshot.json /tmp/snapshot.json
        timeout-minutes: 10
        env:
          # LLM 语境翻译通道（火山方舟）；缺失时自动回退 gtx 机翻
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          # 源健康告警：连续失败自动开 Issue（缺失时静默跳过）
          REPO_ALERT_TOKEN: ${{ secrets.REPO_ALERT_TOKEN }}
          # 聚合直写远端 Turso 库：日报邮件/今日头条海报与站点共享同一数据源
          # （站点实例的 /tmp 临时库不持久，日报不能依赖它；缺失时退化为本地库仅出快照）
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: 提交快照到 snapshot 分支（不触发 Vercel 部署）
        run: |
          git config user.name "tidewire-bot"
          git config user.email "tidewire-bot@users.noreply.github.com"
          repo_root="$PWD"
          snapshot_worktree="$(mktemp -d)"
          cleanup_snapshot_worktree() {
            cd "$repo_root"
            git worktree remove --force "$snapshot_worktree" 2>/dev/null || true
          }
          trap cleanup_snapshot_worktree EXIT

          if git ls-remote --exit-code --heads origin snapshot >/dev/null 2>&1; then
            git fetch origin snapshot:snapshot
            git worktree add "$snapshot_worktree" snapshot
          else
            git worktree add --detach "$snapshot_worktree" HEAD
            cd "$snapshot_worktree"
            git checkout --orphan snapshot
            git rm -rf . 2>/dev/null || true
          fi
          mkdir -p "$snapshot_worktree/data"
          cp /tmp/snapshot.json "$snapshot_worktree/data/snapshot.json"
          # snapshot 分支自带 ignoreCommand：Vercel 检出该分支即整分支跳过构建
          #（ignoreCommand 按被部署分支读取，主仓库 vercel.json 对本分支无效）
          printf '{\n  "ignoreCommand": "exit 0"\n}\n' > "$snapshot_worktree/vercel.json"
          cd "$snapshot_worktree"
          git add data/snapshot.json vercel.json
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore(snapshot): 定时聚合 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:snapshot
          fi
