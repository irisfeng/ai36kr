name: aggregate

# 定时聚合全部 RSS 源并提交内容快照（data/snapshot.json）：
# Vercel 关联仓库后，快照提交会触发自动部署，新部署自带最新内容；
# serverless 冷启动时从快照水合，站点永不空白。
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# 与 daily-digest 共用同一并发组：两个 workflow 都会 push main，串行化避免
# GitHub 延迟释放的定时运行成批撞车（non-fast-forward）
concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 聚合全部信息源并导出快照
        run: node scripts/aggregate.mjs
        timeout-minutes: 10
        env:
          # LLM 语境翻译通道（火山方舟）；缺失时自动回退 gtx 机翻
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          # 源健康告警：连续失败自动开 Issue（缺失时静默跳过）
          REPO_ALERT_TOKEN: ${{ secrets.REPO_ALERT_TOKEN }}

      - name: 提交快照
        run: |
          git config user.name "tidewire-bot"
          git config user.email "tidewire-bot@users.noreply.github.com"
          git add data/snapshot.json
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore(snapshot): 定时聚合 $(date -u +'%Y-%m-%d %H:%M UTC')"
            # 跨 workflow 并发组外的残余竞争兜底：rebase 后重试推送
            for i in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              sleep 5
            done
            exit 1
          fi
